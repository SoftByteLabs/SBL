[project]
name = "SBL"
version = "1.0.4"
description = "Utility custom nodes for ComfyUI: prompts, flexible resolution with megapixel limits, safe math, seed/noise and YuE2 instrumental preparation."
requires-python = ">=3.10"
dependencies = []
license = {file = "LICENSE"}
classifiers = [
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.urls]
Repository = "https://github.com/SoftByteLabs/SBL"
"Bug Tracker" = "https://github.com/SoftByteLabs/SBL/issues"

[tool.comfy]
PublisherId = "sbl"
DisplayName = "SBL"
Icon = "https://raw.githubusercontent.com/SoftByteLabs/SBL/main/assets/sbl-icon.png"
Banner = "https://raw.githubusercontent.com/SoftByteLabs/SBL/main/assets/sbl-banner.png"